name: SmartSpeedCompanion
options:
  bundleIdPrefix: com.speedsense
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.0.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "VCNBBG32P6"
    MARKETING_VERSION: "2.1.4"
    CURRENT_PROJECT_VERSION: "4"
    ENABLE_BITCODE: NO
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:

  # ── Main iPhone App ──────────────────────────────────────────────
  SmartSpeedCompanion:
    type: application
    platform: iOS
    deploymentTarget: "18.0"

    sources:
      - path: SmartSpeedCompanion/App
      - path: SmartSpeedCompanion/CarPlay
      - path: SmartSpeedCompanion/Core
      - path: SmartSpeedCompanion/Extensions
      - path: SmartSpeedCompanion/Models
      - path: SmartSpeedCompanion/ViewModels
      - path: SmartSpeedCompanion/Views
      - path: SmartSpeedCompanion/Features/iOS26/CrashDetection
      - path: SmartSpeedCompanion/Features/iOS26/Siri
      - path: SmartSpeedCompanion/Features/iOS26/StandBy
      - path: SmartSpeedCompanion/Features/iOS26/LiveActivities
      - path: SmartSpeedCompanion/Resources/Assets.xcassets
      # Explicitly declare DB as a resource to be copied into the app bundle
      - path: SmartSpeedCompanion/Resources/ArizonaSpeedLimits.sqlite
        buildPhase: resources
      - path: SmartSpeedCompanion/Configuration/GoogleService-Info.plist
        buildPhase: resources

    # NOTE: LiveActivities and Widgets folders are excluded from main
    # app sources for now — they compile as separate extension targets
    # which are disabled below until Xcode 16 runner is available

    resources:
      - path: SmartSpeedCompanion/Resources/Assets.xcassets

    entitlements:
      path: SmartSpeedCompanion/Resources/Entitlements/SmartSpeedCompanion.entitlements

    info:
      path: SmartSpeedCompanion/Configuration/Info.plist
      properties:
        # CFBundleVersion and CFBundleShortVersionString MUST be declared here (with the
        # Xcode build-setting variable references below) — XcodeGen regenerates Info.plist
        # from this block at generate time and a literal CFBundleVersion key was missing,
        # causing App Store Connect ingestion to fall back to version "1" and produce a 409
        # duplicate error after every bump to CURRENT_PROJECT_VERSION. With these explicit
        # entries, Xcode substitutes $(CURRENT_PROJECT_VERSION) / $(MARKETING_VERSION) into
        # the final Info.plist at archive time and altool sees the actual build number.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleName: Speedio
        CFBundleDisplayName: Speedio
        CFBundleIdentifier: com.speedsense.app
        # ITSAppUsesNonExemptEncryption: false declares that the app uses only standard,
        # exempt encryption via Apple's OS-provided stack (TLS in URLSession, HTTPS in the
        # Firebase SDK, HTTPS in our ArcGIS / Overpass providers, etc.). With this key
        # present in the generated Info.plist, App Store Connect skips the post-upload
        # export-compliance form on every future upload. Apple's spec:
        # https://developer.apple.com/documentation/bundleresources/information-property-list/itsappusesnonexemptencryption
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UIBackgroundModes:
          - location
          - audio
          - fetch
          - remote-notification
        NSLocationAlwaysAndWhenInUseUsageDescription: "Speed Sense needs your location to monitor your speed in real time."
        NSLocationWhenInUseUsageDescription: "Speed Sense needs your location to monitor your speed."
        NSMotionUsageDescription: "Used to detect sudden deceleration for crash detection."
        NSSiriUsageDescription: "Use Siri to start and stop your drive sessions."
        CPSupportedTemplates:
          - CPMapTemplate
          - CPAlertTemplate
        UIRequiredDeviceCapabilities:
          - location-services
          - gps
        # NOTE: XcodeGen regenerates Info.plist from this block at build time, so orientation keys
        # must be declared here. Source SmartSpeedCompanion/Configuration/Info.plist is overridden
        # by the generated copy; altool's "Invalid bundle. No orientations were specified" 409
        # validation surfaces when these are missing.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # UISupportedInterfaceOrientations~ipad intentionally omitted — the app is iPhone-only
        # (TARGETED_DEVICE_FAMILY=1 in settings.base). Including this key would be a no-op
        # but removing it prevents App Store Connect ingestion from flagging a
        # "iPad orientation present in iPhone-only binary" warning.

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speedsense.app
        INFOPLIST_FILE: SmartSpeedCompanion/Configuration/Info.plist
        CODE_SIGN_ENTITLEMENTS: SmartSpeedCompanion/Resources/Entitlements/SmartSpeedCompanion.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Speedio App Store"
        # TARGETED_DEVICE_FAMILY=1 declares the binary as iPhone-only. This app is a
        # CarPlay + Live Activities driving app — iPads do not run CarPlay and there is
        # no iPad UI. With UIDeviceFamily=[1] the App Store Connect submission form
        # stops requiring 12.9" iPad Pro screenshots and Apple only lists the build as
        # installable on iPhone in the App Store. (1,2) is the Xcode default and was
        # silently making ASC treat Speedio as a universal iOS app.
        TARGETED_DEVICE_FAMILY: "1"

    # SpeedWidget and SpeedLiveActivity removed from dependencies
    # until iOS 26 / Xcode 16 runner is available on GitHub Actions
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAnalytics

schemes:
  SmartSpeedCompanion:
    build:
      targets:
        SmartSpeedCompanion: all
    run:
      config: Debug
    archive:
      config: Release
