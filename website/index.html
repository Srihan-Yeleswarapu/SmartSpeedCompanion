<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Speedio &mdash; Speed Limit Lookup</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --bg-1: #0c1116; --bg-2: #16202c;
      --panel: rgba(15, 22, 31, 0.78);
      --panel-border: rgba(255,255,255,0.12);
      --text: #f0f4f9;
      --mute: #98a4b3;
      --accent: #00d4ff;
      --az: #ffae3a;
      --arcgis: #00d4ff;
      --overpass: #2ee07a;
      --miss: #ff7163;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--text); overflow: hidden;
    }
    #app { position: relative; height: 100vh; width: 100%; }
    #map { position: absolute; inset: 0; }
    .leaflet-container { background: #1a222b !important; }

    header {
      position: absolute; top: 16px; left: 16px; z-index: 1000;
      background: var(--panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 14px; padding: 14px 20px; max-width: 340px;
    }
    header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
    header p { font-size: 12px; color: var(--mute); margin-top: 4px; line-height: 1.5; }
    header .dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); margin-right: 6px; animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* Top big-number speed panel (iOS-equivalent answer). */
    #big {
      position: absolute; top: 16px; right: 16px; z-index: 1001;
      background: var(--panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 18px; padding: 22px 26px; min-width: 260px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    #big.loading { opacity: 0.6; }
    #big .mph {
      font-size: 84px; font-weight: 700; line-height: 1; letter-spacing: -0.04em;
      background: linear-gradient(135deg, #00d4ff, #2ee07a);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #big.nodata .mph {
      background: linear-gradient(135deg, #98a4b3, #6c7a89);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #big .mph-unit {
      font-size: 26px; color: var(--mute); font-weight: 600; vertical-align: top;
      line-height: 1; margin-left: 6px;
    }
    #big .road-name { margin-top: 10px; font-size: 14px; color: var(--text); font-weight: 600; }
    #big .road-key  { margin-top: 4px; font-size: 12px; color: var(--mute); font-family: "SF Mono", "Menlo", monospace; }
    #big .detail    { margin-top: 8px; font-size: 11.5px; color: var(--mute); line-height: 1.45; }
    #big .meta { margin-top: 8px; font-size: 10.5px; color: var(--mute); font-family: "SF Mono", "Menlo", monospace; }
    #big .source-badge {
      display: inline-block; margin-top: 10px; padding: 4px 12px;
      background: rgba(0, 212, 255, 0.18); border: 1px solid rgba(0, 212, 255, 0.4);
      border-radius: 999px; font-size: 11px; font-weight: 500;
    }
    #big .source-badge.db    { background: rgba(255, 174, 58, 0.18); border-color: rgba(255, 174, 58, 0.4); color: var(--az); }
    #big .source-badge.arcgis    { background: rgba(0, 212, 255, 0.18); border-color: rgba(0, 212, 255, 0.4); color: var(--arcgis); }
    #big .source-badge.overpass  { background: rgba(46, 224, 122, 0.18); border-color: rgba(46, 224, 122, 0.4); color: var(--overpass); }
    #big .source-badge.nodata    { background: rgba(255, 113, 99, 0.18); border-color: rgba(255, 113, 99, 0.4); color: var(--miss); }

    /* Three source cards beneath the big number. */
    #sources {
      position: absolute; top: 200px; right: 16px; z-index: 1000;
      display: flex; flex-direction: column; gap: 8px; min-width: 260px;
    }
    .src-card {
      background: var(--panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border); border-radius: 12px;
      padding: 10px 14px;
      transition: border 0.15s ease;
    }
    .src-card.loading { opacity: 0.55; }
    .src-card.picked { border-color: rgba(46, 224, 122, 0.6); }
    .src-card .src-header {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase;
    }
    .src-card .src-name.az       { color: var(--az); }
    .src-card .src-name.arcgis   { color: var(--arcgis); }
    .src-card .src-name.overpass { color: var(--overpass); }
    .src-card .src-mph { font-size: 22px; font-weight: 700; margin-top: 4px; }
    .src-card .src-detail { font-size: 11px; color: var(--mute); margin-top: 4px; line-height: 1.4; }
    .src-card .src-empty { color: var(--miss); font-size: 12px; font-style: italic; }
    .src-card .src-error { color: var(--miss); font-size: 12px; }

    /* Trace panel (per-step log; kept from prior version). */
    #tracer {
      position: absolute; bottom: 16px; left: 16px; right: 16px; z-index: 1000;
      background: var(--panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 14px; padding: 14px 18px;
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 11.5px; line-height: 1.7;
      max-height: 200px; overflow: hidden;
      transform: translateY(calc(100% + 16px));
      transition: transform 0.25s ease;
    }
    #tracer.show { transform: translateY(0); }
    #tracer .row {
      display: flex; gap: 12px; padding: 2px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    #tracer .row:last-child { border-bottom: 0; }
    #tracer .step {
      width: 160px; color: var(--mute); flex-shrink: 0; font-weight: 600;
    }
    #tracer .msg { flex: 1; color: var(--text); word-break: break-word; }
    #tracer .ok .step { color: var(--overpass); }
    #tracer .ok .msg { color: var(--overpass); }
    #tracer .hit .step { color: var(--az); }
    #tracer .hit .msg { color: var(--az); }
    #tracer .err .step { color: var(--miss); }
    #tracer .err .msg { color: var(--miss); }
    #tracer .sys .step { color: var(--accent); }
    #tracer .sys .msg { color: var(--accent); }

    #tracer-toggle {
      position: absolute; bottom: 16px; left: 16px; z-index: 1001;
      background: var(--panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 999px; padding: 9px 18px;
      color: var(--text); font-size: 12px; cursor: pointer;
      transition: all 0.2s ease;
    }
    #tracer-toggle:hover { background: rgba(0,212,255,0.15); border-color: var(--accent); }
    #tracer-toggle.open { background: rgba(0,212,255,0.2); }

    .leaflet-pin {
      width: 28px; height: 28px;
      background: radial-gradient(circle at 50% 50%, var(--accent) 10%, rgba(0,212,255,0.6) 35%, rgba(0,212,255,0) 75%);
      border-radius: 50%; pointer-events: none;
      box-shadow: 0 0 0 2px rgba(0,212,255,0.5);
      animation: drop 0.4s ease-out;
    }
    @keyframes drop {
      0% { transform: scale(0.2) translateY(-20px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    @media (max-width: 600px) {
      #big { left: 16px; right: 16px; padding: 16px 18px; min-width: 0; top: auto; bottom: 220px; }
      #big .mph { font-size: 64px; }
      header { left: 12px; top: 12px; max-width: 280px; }
      #sources { left: 12px; right: 12px; top: auto; bottom: 76px; }
      #tracer { left: 12px; right: 12px; bottom: 76px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1><span class="dot"></span>Speedio Lookup</h1>
      <p>Click anywhere on the map. The pipeline (AZ SQLite &rarr; ArcGIS HPMS &rarr; Overpass) runs the same way as the iPhone app. The big number shows what the app would display; the cards below show each provider individually.</p>
    </header>

    <div id="map"></div>

    <!-- Big top number: iOS-equivalent answer. -->
    <div id="big" style="display:none;"></div>

    <!-- Three provider cards (filled after every click). -->
    <div id="sources" style="display:none;">
      <div class="src-card" data-provider="az">
        <div class="src-header">
          <span class="src-name az">1. AZ SQLite</span><span class="status">…</span>
        </div>
        <div class="src-mph"></div>
        <div class="src-detail"></div>
      </div>
      <div class="src-card" data-provider="arcgis">
        <div class="src-header">
          <span class="src-name arcgis">2. ArcGIS HPMS</span><span class="status">…</span>
        </div>
        <div class="src-mph"></div>
        <div class="src-detail"></div>
      </div>
      <div class="src-card" data-provider="overpass">
        <div class="src-header">
          <span class="src-name overpass">3. Overpass</span><span class="status">…</span>
        </div>
        <div class="src-mph"></div>
        <div class="src-detail"></div>
      </div>
    </div>

    <button id="tracer-toggle">&#128225; Pipeline trace</button>
    <div id="tracer"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    /* ======================================================================
       Mirrors the iOS Speedio pipeline (SpeedLimitService.swift):
         0. RoadGeocoder.resolveRoadContext  -> road_name
         1. hasNearbyCoverage               -> cheap corridor gate
         1.5. AZ SQLite w/ road_name        -> name-first matching
         2. ArcGIS HPMS                     -> live chain
         3. Overpass (OSM maxspeed)         -> live chain
         ExpandedSearch fallback            -> skipped on web for speed
       The big top number tracks the iOS'logical pick (first non-null).
       The 3 cards below display each provider's individual result.
       ====================================================================== */

    const map = L.map('map', { zoomControl: true }).setView([33.4484, -112.0740], 11);
    L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      { subdomains: 'abcd', maxZoom: 19,
        attribution: '&copy; OpenStreetMap, &copy; CARTO' }
    ).addTo(map);

    let marker = null;
    const bigEl = document.getElementById('big');
    const sourcesEl = document.getElementById('sources');
    const tracerEl = document.getElementById('tracer');
    const toggleEl = document.getElementById('tracer-toggle');

    // ---- Trace panel ----
    function trace(provider, msg, status) {
      const row = document.createElement('div');
      row.className = 'row ' + (status || '');
      const ts = new Date().toLocaleTimeString();
      const safeMsg = String(msg).replace(/[<>]/g, c => c === '<' ? '&lt;' : '&gt;');
      row.innerHTML =
        '<div class="step">' + provider + '</div>' +
        '<div class="msg">[' + ts + '] ' + safeMsg + '</div>';
      tracerEl.appendChild(row);
    }
    function clearTrace() { tracerEl.innerHTML = ''; }
    toggleEl.addEventListener('click', () => {
      tracerEl.classList.toggle('show');
      toggleEl.classList.toggle('open');
    });

    // ---- Provider 1: AZ SQLite (mirrors ArizonaSpeedLimitService) ----
    async function queryAzSqlite(lat, lon, roadName) {
      trace('AZ SQLite', `POST /api/speedlimit-az ${roadName ? '(road_name=' + roadName + ')' : '(no road_name)'}`, 'sys');
      let r;
      try {
        r = await fetch('/api/speedlimit-az', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lat, lon, road_name: roadName || null }),
        });
      } catch (e) {
        trace('AZ SQLite', 'network error: ' + e.message, 'err');
        return { found: false, error: e.message };
      }
      if (!r.ok) {
        trace('AZ SQLite', 'HTTP ' + r.status, 'err');
        return { found: false, error: 'HTTP ' + r.status };
      }
      const d = await r.json();
      if (!d.found) {
        trace('AZ SQLite', 'no segment matched (no name match, no spatial match)', 'err');
        return { found: false };
      }
      trace('AZ SQLite',
        d.speedMph + ' mph &middot; routeId=' + (d.routeId || '?') + ' &middot; ' + d.detail,
        'hit');
      return { found: true, ...d };
    }

    // ---- Provider 2: ArcGIS HPMS (port of ArcGISHPMSSpeedLimitProvider) ----
    async function queryArcGIS(lat, lon) {
      trace('ArcGIS HPMS', 'POST /api/speedlimit-arcgis', 'sys');
      try {
        const r = await fetch('/api/speedlimit-arcgis', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lat, lon }),
        });
        if (!r.ok) { trace('ArcGIS HPMS', 'HTTP ' + r.status, 'err'); return { found: false }; }
        const d = await r.json();
        if (!d.found) { trace('ArcGIS HPMS', 'no sample panel within corridor', 'err'); return { found: false }; }
        trace('ArcGIS HPMS',
          d.speedLimitMph + ' mph &middot; ' + d.roadKey,
          'hit');
        return { found: true, speedMph: d.speedLimitMph, providerName: 'ArcGIS',
                 roadKey: d.roadKey, detail: d.detail };
      } catch (e) {
        trace('ArcGIS HPMS', 'network error: ' + e.message, 'err');
        return { found: false, error: e.message };
      }
    }

    // ---- Provider 3: Overpass (port of OverpassSpeedLimitProvider) ----
    async function queryOverpass(lat, lon) {
      trace('Overpass', 'POST /api/speedlimit-overpass', 'sys');
      try {
        const r = await fetch('/api/speedlimit-overpass', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lat, lon }),
        });
        if (!r.ok) { trace('Overpass', 'HTTP ' + r.status, 'err'); return { found: false }; }
        const d = await r.json();
        if (!d.found) { trace('Overpass', 'no ways tagged [highway][maxspeed] in 100m', 'err'); return { found: false }; }
        trace('Overpass',
          d.speedLimitMph + ' mph &middot; ' + d.roadKey + ' &middot; ' + d.detail,
          'hit');
        return { found: true, speedMph: d.speedLimitMph, providerName: 'Overpass',
                 roadKey: d.roadKey, detail: d.detail };
      } catch (e) {
        trace('Overpass', 'network error: ' + e.message, 'err');
        return { found: false, error: e.message };
      }
    }

    // ---- Step 0: reverse-geocode ----
    async function reverseGeocode(lat, lon) {
      trace('ReverseGeocode', `GET /api/reverse-geocode?lat=${lat}&lon=${lon}`, 'sys');
      try {
        const r = await fetch(`/api/reverse-geocode?lat=${lat}&lon=${lon}`);
        if (!r.ok) {
          trace('ReverseGeocode', 'HTTP ' + r.status, 'err');
          return null;
        }
        const d = await r.json();
        if (!d.road_name) {
          trace('ReverseGeocode', 'no road_name resolved; using spatial-only', 'err');
          return d;
        }
        trace('ReverseGeocode', 'road_name=' + d.road_name + ' &middot; display=' + (d.display_name || ''), 'hit');
        return d;
      } catch (e) {
        trace('ReverseGeocode', 'error: ' + e.message, 'err');
        return null;
      }
    }

    // ---- Orchestrator (mirrors SmartSpeedLimitService.updateSpeedLimit) ----
    // returns { provider, answer, road_name } where `provider` is one of
    // 'az' | 'arcgis' | 'overpass' | 'nodata' (matching the iOS-equivalent pick).
    async function lookupAllSources(lat, lon) {
      clearTrace();
      trace('PIPELINE', `lat=${lat.toFixed(6)} lon=${lon.toFixed(6)}`, 'sys');

      const rg = await reverseGeocode(lat, lon) || {};
      const roadName = rg.road_name || null;
      trace('PIPELINE', 'road_name=' + (roadName || '<none>'), 'sys');

      // Run all three in parallel so the user sees them simultaneously.
      trace('PIPELINE', 'parallel fetch: AZ SQLite | ArcGIS | Overpass', 'sys');
      const [az, arc, ov] = await Promise.all([
        queryAzSqlite(lat, lon, roadName),
        queryArcGIS(lat, lon),
        queryOverpass(lat, lon),
      ]);

      // iOS-equivalent pick: AZ first (with name-match boost), then ArcGIS,
      // then Overpass, then 'No Data'. Matches SmartSpeedLimitService chain.
      let pick = null, pickSrc = 'nodata';
      if (az.found)        { pick = { mph: az.speedMph, provider: 'az', detail: az.detail, routeId: az.routeId }; pickSrc = 'az'; }
      else if (arc.found)  { pick = { mph: arc.speedMph, provider: 'arcgis', detail: arc.detail, roadKey: arc.roadKey }; pickSrc = 'arcgis'; }
      else if (ov.found)   { pick = { mph: ov.speedMph, provider: 'overpass', detail: ov.detail, roadKey: ov.roadKey }; pickSrc = 'overpass'; }
      else                 { pick = { mph: null, provider: null }; pickSrc = 'nodata'; }

      trace('PIPELINE',
        pickSrc === 'nodata' ? 'no provider hit -> No Data'
          : `pick=${pickSrc} mph=${pick.mph}`,
        pickSrc === 'nodata' ? 'err' : 'ok');

      return { az, arc, ov, pick, pickSrc, roadName, rg };
    }

    // ---- Renderers ----
    function renderBig(p, lat, lon, roadName) {
      const has = p.mph != null && p.mph > 0;
      const klass = ({az:'db', arcgis:'arcgis', overpass:'overpass', nodata:'nodata'})[p.provider || 'nodata'] || 'nodata';
      const providerLabel = ({az:'AZ SQLite (name-matched)', arcgis:'ArcGIS HPMS', overpass:'Overpass', nodata:'No Data'})[p.provider || 'nodata'];
      const safe = (s) => String(s == null ? '' : s).replace(/[<>]/g, c => c === '<' ? '&lt;' : '&gt;');
      bigEl.className = klass === 'nodata' ? 'nodata' : '';
      bigEl.innerHTML =
        '<div>' +
          '<span class="mph">' + (has ? p.mph : '\u2014') + '</span>' +
          '<span class="mph-unit">' + (has ? 'mph' : '') + '</span>' +
        '</div>' +
        (roadName ? '<div class="road-name">' + safe(roadName) + '</div>' : '') +
        (p.routeId ? '<div class="road-key">RouteId=' + safe(p.routeId) + '</div>' :
         p.roadKey ? '<div class="road-key">' + safe(p.roadKey) + '</div>' : '') +
        (p.detail ? '<div class="detail">' + safe(p.detail) + '</div>' : '') +
        '<div class="meta">&#128205; ' + lat.toFixed(5) + ', ' + lon.toFixed(5) + '</div>' +
        '<div class="source-badge ' + klass + '">' + providerLabel + '</div>';
      bigEl.style.display = 'block';
    }

    function renderCard(card, r) {
      card.classList.remove('loading');
      card.classList.toggle('picked', !!r.picked);
      const statusEl = card.querySelector('.status');
      const mphEl    = card.querySelector('.src-mph');
      const detailEl = card.querySelector('.src-detail');
      const safe = (s) => String(s == null ? '' : s).replace(/[<>]/g, c => c === '<' ? '&lt;' : '&gt;');
      if (!r || r.found === false) {
        if (r && r.error) {
          statusEl.textContent = 'err';
          mphEl.innerHTML = '';
          detailEl.innerHTML = '<span class="src-error">' + safe(r.error) + '</span>';
        } else if (r && r.reason) {
          // AZ SQLite REJECTED: road_name had no coverage near this point.
          // Show the reason so the user understands why their snap dropped
          // out instead of attributing the gap silently to S 202 or another
          // mega-bbox freeway segment.
          statusEl.textContent = 'no data';
          mphEl.innerHTML = '';
          detailEl.innerHTML = '<span class="src-empty">' + safe(r.reason)
            + '</span>';
        } else {
          statusEl.textContent = 'no data';
          mphEl.innerHTML = '';
          detailEl.innerHTML = '<span class="src-empty">No data for this point.</span>';
        }
      } else {
        statusEl.textContent = 'hit';
        mphEl.innerHTML = r.speedMph + ' <small style="font-size:13px;color:var(--mute);font-weight:600;">mph</small>';
        detailEl.textContent = (r.detail || '') + (r.roadKey ? ' (' + r.roadKey + ')' : '');
      }
    }

    function renderSources(all, pickSrc) {
      renderCard(document.querySelector('.src-card[data-provider="az"]'),
                 Object.assign({}, all.az,    { picked: pickSrc === 'az' }));
      renderCard(document.querySelector('.src-card[data-provider="arcgis"]'),
                 Object.assign({}, all.arc,   { picked: pickSrc === 'arcgis' }));
      renderCard(document.querySelector('.src-card[data-provider="overpass"]'),
                 Object.assign({}, all.ov,    { picked: pickSrc === 'overpass' }));
      sourcesEl.style.display = 'flex';
    }

    function setLoading(lat, lon) {
      // Reset all three cards to "loading" state.
      sourcesEl.style.display = 'flex';
      bigEl.style.display = 'block';
      bigEl.classList.add('loading');
      bigEl.innerHTML =
        '<div style="text-align:center;color:var(--mute);padding:8px 0;">&#8987; Querying ' +
        'AZ SQLite &middot; ArcGIS &middot; Overpass &hellip;</div>';
      document.querySelectorAll('.src-card').forEach(c => {
        c.classList.add('loading');
        c.classList.remove('picked');
        c.querySelector('.status').textContent = '\u00B7\u00B7\u00B7';
        c.querySelector('.src-mph').innerHTML = '';
        c.querySelector('.src-detail').innerHTML = '';
      });
    }

    // ---- Click handler ----
    map.on('click', async (e) => {
      const lat = e.latlng.lat;
      const lon = e.latlng.lng;
      if (marker) map.removeLayer(marker);
      marker = L.marker([lat, lon], {
        icon: L.divIcon({
          className: '',
          html: '<div class="leaflet-pin"></div>',
          iconSize: [28, 28],
          iconAnchor: [14, 14],
        }),
      }).addTo(map);
      tracerEl.classList.add('show');
      toggleEl.classList.add('open');
      setLoading(lat, lon);
      const all = await lookupAllSources(lat, lon);
      bigEl.classList.remove('loading');
      renderBig(all.pick, lat, lon, all.roadName);
      renderSources(all, all.pickSrc);
    });
  </script>
</body>
</html>
