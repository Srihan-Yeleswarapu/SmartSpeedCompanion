name: 🚀 Speedio Release (Signed)

on:
  push:
    branches: [ version2 ]
  workflow_dispatch:

jobs:
  distribute:
    name: Build and Release Signed IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build App Store Archive (Signed)
        run: |
          xcodebuild clean archive -project SmartSpeedCompanion.xcodeproj -scheme SmartSpeedCompanion -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -archivePath ./SmartSpeedCompanion.xcarchive

      - name: Setup signing
        env:
          KEYCHAIN_PASSWORD: "build_keychain_pass"
          PP_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_DIR=~/Library/MobileDevice/Provisioning\\ Profiles
          mkdir -p "$PP_DIR"

          openssl x509 -inform DER -in SmartSpeedCompanion/distribution.cer -out /tmp/distribution.pem
          openssl pkcs12 -export -inkey SmartSpeedCompanion/SmartSpeedCompanion.key -in /tmp/distribution.pem -out "$CERT_PATH" -passout pass:speedio123

          echo "$PP_BASE64" | tr -d '[:space:]' | base64 -D > "$PP_DIR/Speedio.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/app-signing.keychain-db
          security set-keychain-settings -lut 21600 $RUNNER_TEMP/app-signing.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/app-signing.keychain-db
          security import "$CERT_PATH" -k $RUNNER_TEMP/app-signing.keychain-db -P "speedio123" -T /usr/bin/codesign
          security list-keychains -d user -s $RUNNER_TEMP/app-signing.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/app-signing.keychain-db

      - name: Export IPA
        run: |
          cat > exportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store</string>
              <key>signingStyle</key><string>manual</string>
              <key>provisioningProfileSpecifier</key><string>Speedio App Store</string>
              <key>teamID</key><string>VCNBBG32P6</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive -archivePath ./SmartSpeedCompanion.xcarchive -exportOptionsPlist exportOptions.plist -exportPath ./Export

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app --file "./Export/SmartSpeedCompanion.ipa" --type ios --username "${{ secrets.APPSTORE_CONNECT_USERNAME }}" --password "${{ secrets.APPSTORE_CONNECT_PASSWORD }}" --show-progress

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Speedio-IPA-${{ github.run_number }}
          path: Export/*.ipa
          retention-days: 7