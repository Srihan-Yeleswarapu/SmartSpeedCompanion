name: 📦 SmartSpeed Companion – Signed Build & TestFlight

on:
  push:
    branches: [ main, version2 ]
  workflow_dispatch:

jobs:
  build-and-testflight:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode Firebase plist (if secret provided)
        env:
          FIREBASE_PLIST_B64: ${{ secrets.FIREBASE_PLIST_B64 }}
        run: |
          if [ -n "$FIREBASE_PLIST_B64" ]; then
            echo "$FIREBASE_PLIST_B64" | base64 --decode > SmartSpeedCompanion/Configuration/GoogleService-Info.plist
            echo "✅ Firebase plist restored"
          else
            echo "⚠️ No Firebase secret set; proceeding without GoogleService-Info.plist"
          fi

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Download iOS platform for Xcode
        run: |
          echo "Checking available platforms..."
          xcrun simctl list runtimes
          echo "Downloading iOS platform..."
          sudo xcodebuild -downloadPlatform iOS

      - name: Set up signing keychain & install certificate
        env:
          KEYCHAIN_PASSWORD: "build_keychain_pass"
        run: |
          if [ ! -f SmartSpeedCompanion/distribution.cer ]; then
            echo "❌ distribution.cer not found"
            exit 1
          fi
          if [ ! -f SmartSpeedCompanion/SmartSpeedCompanion.key ]; then
            echo "❌ SmartSpeedCompanion.key not found"
            exit 1
          fi

          # Create custom keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Convert and import certificate
          openssl x509 -inform DER -in SmartSpeedCompanion/distribution.cer -out /tmp/distribution.pem
          openssl pkcs12 -export -inkey SmartSpeedCompanion/SmartSpeedCompanion.key -in /tmp/distribution.pem -out /tmp/cert.p12 -passout pass:speedio123
          security import /tmp/cert.p12 -k build.keychain -P "speedio123" -T /usr/bin/codesign -T /usr/bin/security

          # Set partition list to allow codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Add to keychain search list (append, don't replace)
          ORIGINAL_KEYCHAINS=$(security list-keychains 2>/dev/null | tr -d '"' | tr -d ' ')
          security list-keychains -s build.keychain $ORIGINAL_KEYCHAINS
          security list-keychains

          # Show available signing identities
          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning build.keychain

      - name: Decode and install provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "=== Decoding provisioning profile ==="
          echo "$PROVISIONING_PROFILE" | tr -d '[:space:]' | base64 -D > /tmp/profile.mobileprovision

          # Verify it's a valid mobileprovision file
          if ! grep -q "<!DOCTYPE plist" /tmp/profile.mobileprovision && ! grep -q "<?xml" /tmp/profile.mobileprovision; then
            echo "⚠️ Raw decode failed, trying alternative..."
            echo "$PROVISIONING_PROFILE" | base64 -d > /tmp/profile.mobileprovision
          fi

          # Show profile info
          echo "Profile file size: $(wc -c < /tmp/profile.mobileprovision) bytes"

          # Extract profile name for verification
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :name" /tmp/profile.mobileprovision 2>/dev/null || echo "unknown")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.mobileprovision 2>/dev/null || echo "unknown")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/profile.mobileprovision 2>/dev/null || echo "unknown")
          APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.mobileprovision 2>/dev/null || echo "unknown")

          echo "Profile Name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Team ID: $TEAM_ID"
          echo "App ID: $APPID"

          # Install to correct location
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          cp /tmp/profile.mobileprovision "$PP_DIR/"
          echo "Installed provisioning profile to: $PP_DIR"
          ls -la "$PP_DIR/"

      - name: Build Signed Archive
        env:
          KEYCHAIN_PASSWORD: "build_keychain_pass"
        run: |
          # Unlock keychain so Xcode can access signing assets
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning build.keychain

          echo "=== Provisioning profiles ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"

          xcodebuild clean archive \
            -project SmartSpeedCompanion.xcodeproj \
            -scheme SmartSpeedCompanion \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            -archivePath ./SmartSpeedCompanion.xcarchive 2>&1 | tail -100

          echo "=== Verifying embedded.mobileprovision in archive ==="
          # Archive structure: SmartSpeedCompanion.xcarchive/Products/Applications/*.app
          ARCHIVE_APP=$(find ./SmartSpeedCompanion.xcarchive -path "*/Products/*.app" -type d 2>/dev/null | head -1)
          if [ -z "$ARCHIVE_APP" ]; then
            ARCHIVE_APP=$(find ./SmartSpeedCompanion.xcarchive -name "*.app" -type d 2>/dev/null | head -1)
          fi
          echo "Found .app at: $ARCHIVE_APP"
          if [ -n "$ARCHIVE_APP" ] && [ -f "$ARCHIVE_APP/embedded.mobileprovision" ]; then
            echo "✅ embedded.mobileprovision FOUND in archive app bundle"
          else
            echo "❌ embedded.mobileprovision NOT found in archive"
            ls -la "$ARCHIVE_APP/" 2>/dev/null || echo ".app bundle contents unavailable"
            exit 1
          fi
        timeout-minutes: 30

      - name: Verify archive exists
        run: |
          if [ -d "./SmartSpeedCompanion.xcarchive" ]; then
            echo "✅ Archive created successfully"
            ls -la ./SmartSpeedCompanion.xcarchive/
            echo "=== Archive Info ==="
            xcodebuild -showBuildSettings -archivePath ./SmartSpeedCompanion.xcarchive 2>/dev/null | grep -E "CODE_SIGN|PROVISIONING|PRODUCT_BUNDLE"
          else
            echo "❌ Archive not found!"
            exit 1
          fi

      - name: Export IPA with embedded provisioning profile
        env:
          KEYCHAIN_PASSWORD: "build_keychain_pass"
        run: |
          # Unlock keychain first
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          echo "=== Signing identities available ==="
          security find-identity -v -p codesigning build.keychain

          echo "=== Provisioning profiles available ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"

          mkdir -p "$PWD/Export"

          cat > exportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store-connect</string>
              <key>signingStyle</key><string>manual</key>
              <key>signingIdentity</key><string>Apple Distribution</string>
              <key>provisioningProfileSpecifier</key><string>Speedio App Store</string>
              <key>teamID</key><string>VCNBBG32P6</string>
              <key>uploadBitcode</key><false/>
              <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

          echo "=== Running xcodebuild -exportArchive ==="
          xcodebuild -exportArchive -verbose -archivePath "$PWD/SmartSpeedCompanion.xcarchive" -exportOptionsPlist exportOptions.plist -exportPath "$PWD/Export" 2>&1 | tail -80

          echo "=== Export directory contents ==="
          find "$PWD/Export" -type f 2>/dev/null
          ls -la "$PWD/Export/"

          IPA_PATH=$(find "$PWD/Export" -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ No IPA file found"
            exit 1
          fi
          echo "✅ IPA created: $IPA_PATH"

          echo "=== Verifying embedded.mobileprovision in IPA ==="
          if unzip -l "$IPA_PATH" | grep -q "embedded.mobileprovision"; then
            echo "✅ embedded.mobileprovision FOUND in IPA"
          else
            echo "❌ WARNING: embedded.mobileprovision NOT found in IPA!"
            exit 1
          fi

      - name: Upload to App Store Connect
        run: |
          IPA_PATH=$(find "$PWD/Export" -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No .ipa file found in Export directory"
            exit 1
          fi
          echo "Uploading IPA: $IPA_PATH"
          echo "IPA size: $(wc -c < "$IPA_PATH") bytes"

          xcrun altool --upload-app --file "$IPA_PATH" --type ios --show-progress -u "${{ secrets.APPSTORE_CONNECT_USERNAME }}" -p "${{ secrets.APPSTORE_CONNECT_PASSWORD }}" 2>&1 | tail -30

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Speedio-IPA-${{ github.run_number }}
          path: Export/*.ipa
          retention-days: 7