name: 📦 SmartSpeed Companion – Signed Build & TestFlight

on:
  push:
    branches: [ main, version2 ]
  workflow_dispatch:

jobs:
  build-and-testflight:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode Firebase plist (if secret provided)
        env:
          FIREBASE_PLIST_B64: ${{ secrets.FIREBASE_PLIST_B64 }}
        run: |
          if [ -n "$FIREBASE_PLIST_B64" ]; then
            echo "$FIREBASE_PLIST_B64" | base64 --decode > SmartSpeedCompanion/Configuration/GoogleService-Info.plist
            echo "✅ Firebase plist restored"
          else
            echo "⚠️ No Firebase secret set; proceeding without GoogleService-Info.plist"
          fi

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set up keychain & import signing certificate
        env:
          KEYCHAIN_PASSWORD: "build_keychain_pass"
        run: |
          if [ ! -f SmartSpeedCompanion/distribution.cer ]; then
            echo "❌ distribution.cer not found"
            exit 1
          fi
          if [ ! -f SmartSpeedCompanion/SmartSpeedCompanion.key ]; then
            echo "❌ SmartSpeedCompanion.key not found"
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          openssl x509 -inform DER -in SmartSpeedCompanion/distribution.cer -out /tmp/distribution.pem
          openssl pkcs12 -export -inkey SmartSpeedCompanion/SmartSpeedCompanion.key -in /tmp/distribution.pem -out /tmp/cert.p12 -passout pass:speedio123

          security import /tmp/cert.p12 -k build.keychain -P "speedio123" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROVISIONING_PROFILE" | tr -d '[:space:]' | base64 -D > /tmp/profile.mobileprovision
          mkdir -p "~/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/profile.mobileprovision "~/Library/MobileDevice/Provisioning Profiles/"

      - name: Build Archive (Unsigned)
        env:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
          PROVISIONING_PROFILE_SPECIFIER: ""
        run: |
          xcodebuild clean archive \
            -project SmartSpeedCompanion.xcodeproj \
            -scheme SmartSpeedCompanion \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ./SmartSpeedCompanion.xcarchive

      - name: Export IPA
        run: |
          cat > exportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfileSpecifier</key><string>Speedio App Store</string>
            <key>teamID</key><string>VCNBBG32P6</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive -archivePath ./SmartSpeedCompanion.xcarchive -exportOptionsPlist exportOptions.plist -exportPath ./Export

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app --file "./Export/SmartSpeedCompanion.ipa" --type ios --username "${{ secrets.APPSTORE_CONNECT_USERNAME }}" --password "${{ secrets.APPSTORE_CONNECT_PASSWORD }}" --show-progress

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Speedio-IPA-${{ github.run_number }}
          path: Export/*.ipa
          retention-days: 7