name: 📦 SmartSpeed Companion – Signed Build & TestFlight

on:
  push:
    branches: [ main, version2 ]
  workflow_dispatch:

jobs:
  build-and-testflight:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode Firebase plist (if secret provided)
        env:
          FIREBASE_PLIST_B64: ${{ secrets.FIREBASE_PLIST_B64 }}
        run: |
          if [ -n "$FIREBASE_PLIST_B64" ]; then
            echo "$FIREBASE_PLIST_B64" | base64 --decode > SmartSpeedCompanion/Configuration/GoogleService-Info.plist
            echo "[OK] Firebase plist restored"
          else
            echo "[WARN] No Firebase secret set; proceeding without GoogleService-Info.plist"
          fi

      - name: Create HERE-Config.plist (from secret)
        env:
          HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
        run: |
          if [ -n "$HERE_API_KEY" ]; then
            echo '<?xml version="1.0" encoding="UTF-8"?>' > SmartSpeedCompanion/Configuration/HERE-Config.plist
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> SmartSpeedCompanion/Configuration/HERE-Config.plist
            echo '<plist version="1.0">' >> SmartSpeedCompanion/Configuration/HERE-Config.plist
            echo '<dict>' >> SmartSpeedCompanion/Configuration/HERE-Config.plist
            echo '    <key>api_key</key>' >> SmartSpeedCompanion/Configuration/HERE-Config.plist
            echo "    <string>${HERE_API_KEY}</string>" >> SmartSpeedCompanion/Configuration/HERE-Config.plist
            echo '</dict>' >> SmartSpeedCompanion/Configuration/HERE-Config.plist
            echo '</plist>' >> SmartSpeedCompanion/Configuration/HERE-Config.plist
            echo "[OK] HERE-Config.plist created (api_key: ${#HERE_API_KEY} chars)"
          else
            echo "[ERROR] HERE_API_KEY secret is not set; the app cannot resolve any live speed limits."
            exit 1
          fi

      - name: Select Xcode
        # Prefer Xcode 26.6 (matches project.yml `xcodeVersion: "26.6"`),
        # but fall back gracefully to any Xcode 26.x point release if a
        # future runner image swaps in e.g. 26.7 before this workflow is
        # updated. Reject anything older than 26.x explicitly so a stray
        # Xcode 16.2 (from a different runner image) can't silently drift
        # into the toolchain. macos-26 ships 26.0.1 .. 26.6 today.
        # Mirrors `distribute.yml`'s pattern.
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26.6*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$XCODE_PATH" ]; then
            echo "[ERROR] No Xcode 26.x installed on this runner. Check the macos-26 runner image manifest."
            ls -d /Applications/Xcode_* 2>/dev/null
            exit 1
          fi
          echo "Selecting: $XCODE_PATH"
          echo "Active developer dir: $(sudo xcode-select -p)"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Download iOS platform for Xcode
        run: |
          echo "Checking available platforms..."
          xcrun simctl list runtimes
          echo "Downloading iOS platform..."
          sudo xcodebuild -downloadPlatform iOS

      - name: Set up signing keychain & install certificate
        env:
          KEYCHAIN_PASSWORD: "build_keychain_pass"
        run: |
          if [ ! -f SmartSpeedCompanion/distribution.cer ]; then
            echo "[ERROR] distribution.cer not found"
            exit 1
          fi
          if [ ! -f SmartSpeedCompanion/SmartSpeedCompanion.key ]; then
            echo "[ERROR] SmartSpeedCompanion.key not found"
            exit 1
          fi

          # Create custom keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Convert and import certificate
          openssl x509 -inform DER -in SmartSpeedCompanion/distribution.cer -out /tmp/distribution.pem
          # Force legacy PKCS12 algorithms (PBES1 + 3DES + SHA1 HMAC). OpenSSL 3.x
          # defaults to PBES2 / AES-256 / SHA256 which `security import` on macOS
          # rejects with "MAC verification failed during PKCS12 import (wrong password?)".
          # The legacy crypto override restores cross-tool compatibility. These params
          # are still recognized by OpenSSL 3.x without needing `-legacy`.
          openssl pkcs12 -export -inkey SmartSpeedCompanion/SmartSpeedCompanion.key -in /tmp/distribution.pem -out /tmp/cert.p12 -passout pass:speedio123 -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          security import /tmp/cert.p12 -k build.keychain -P "speedio123" -T /usr/bin/codesign -T /usr/bin/security

          # Set partition list to allow codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Add to keychain search list (append, don't replace)
          ORIGINAL_KEYCHAINS=$(security list-keychains 2>/dev/null | tr -d '"' | tr -d ' ')
          security list-keychains -s build.keychain $ORIGINAL_KEYCHAINS
          security list-keychains

          # Show available signing identities
          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning build.keychain

      - name: Decode and install provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "=== Decoding provisioning profile ==="

          # Step 1: Decode base64 -> raw bytes (PKCS#7 envelope)
          python3 -c "import base64; data = base64.b64decode(''.join('$PROVISIONING_PROFILE'.split())); open('/tmp/profile.mobileprovision.raw', 'wb').write(data); print(f'Raw file: {len(data)} bytes')"

          # Step 2: ALSO produce an unwrapped plist copy for metadata extraction only.
          # DVTProvisioningProfileManager will only accept the raw PKCS#7 envelope,
          # so /tmp/profile.mobileprovision (used downstream by the IPA export
          # step) MUST remain the raw file — never write the plist to it.
          if security cms -D -in /tmp/profile.mobileprovision.raw -out /tmp/profile.unwrapped.plist 2>/dev/null; then
            echo "[OK] Successfully unwrapped CMS/PKCS#7 envelope via security cms"
          else
            echo "[WARN] security cms -D failed - extracting embedded plist directly from DER structure"
            python3 -c "import plistlib,sys; d=open('/tmp/profile.mobileprovision.raw','rb').read(); s=d.find(b'<?xml'); e=d.find(b'</plist>',s); assert s>=0 and e>=0,b'no plist boundaries found'; pb=d[s:e+len(b'</plist>')]; p=plistlib.loads(pb); assert 'UUID' in p, b'plist missing required UUID property'; open('/tmp/profile.unwrapped.plist','wb').write(pb); print('[OK] extracted clean plist: %d bytes, UUID=%s, Name=%s' % (len(pb),p['UUID'],p.get('Name','?')))"
          fi

          # /tmp/profile.mobileprovision must be the RAW PKCS#7 — this is what
          # xcodebuild's DVTProvisioningProfileManager expects later in the
          # 'Build Archive' step AND what we'll later embed in the IPA.
          cp /tmp/profile.mobileprovision.raw /tmp/profile.mobileprovision
          echo "Profile file size: $(wc -c < /tmp/profile.mobileprovision) bytes (raw PKCS#7)"

          # Metadata extraction uses the unwrapped plist (PlistBuddy can't
          # read PKCS#7 binary).
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :name" /tmp/profile.unwrapped.plist 2>/dev/null || echo "unknown")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.unwrapped.plist 2>/dev/null || echo "unknown")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/profile.unwrapped.plist 2>/dev/null || echo "unknown")
          APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.unwrapped.plist 2>/dev/null || echo "unknown")

          # Robust UUID extraction via plistlib (independent of PlistBuddy).
          UUID_FROM_PLIST=$(python3 -c "import plistlib; print(plistlib.loads(open('/tmp/profile.unwrapped.plist','rb').read()).get('UUID',''))" 2>/dev/null || echo "")
          if [ -n "$UUID_FROM_PLIST" ]; then
            PROFILE_UUID="$UUID_FROM_PLIST"
          fi

          # Validate PROFILE_UUID is a real UUID-shaped string before using it as a filename.
          if echo "$PROFILE_UUID" | grep -qE '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            INSTALL_NAME="${PROFILE_UUID}.mobileprovision"
          else
            echo "[WARN] No valid UUID extracted - installing as profile.mobileprovision as fallback"
            INSTALL_NAME="profile.mobileprovision"
          fi

          echo "Profile Name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Team ID: $TEAM_ID"
          echo "App ID: $APPID"

          # Extract entitlements from the unwrapped plist (codesign needs them).
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" /tmp/profile.unwrapped.plist > /tmp/entitlements.plist 2>/dev/null
          if [ -s /tmp/entitlements.plist ]; then
            echo "[OK] Extracted entitlements from provisioning profile"
          else
            echo "[WARN] Could not extract entitlements from profile"
          fi

          # Install the RAW PKCS#7 with the proper UUID-based filename so
          # DVTProvisioningProfileManager loads it via Xcode's expected
          # ~/Library/MobileDevice/Provisioning Profiles/<UUID>.mobileprovision path.
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          cp /tmp/profile.mobileprovision.raw "$PP_DIR/${INSTALL_NAME}"
          echo "Installed provisioning profile to: $PP_DIR"
          ls -la "$PP_DIR/"

      - name: Build Archive (Unsigned for SPM targets)
        env:
          KEYCHAIN_PASSWORD: "build_keychain_pass"
        run: |
          # Defense-in-depth: surface any non-zero exit from xcodebuild directly instead of
          # letting the step finish "successfully" without an xcarchive artifact (which is
          # what it has been doing every run since the speed-limit feature landed).
          set -euo pipefail

          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning build.keychain

          echo "=== Provisioning profiles ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"

          echo "=== xcodebuild archive START at $(date -u +%H:%M:%SZ) ==="

          # Capture the real exit code without aborting on it.
          set +e
          xcodebuild clean archive -project SmartSpeedCompanion.xcodeproj -scheme SmartSpeedCompanion -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO PROVISIONING_PROFILE_SPECIFIER="Speedio App Store" -archivePath ./SmartSpeedCompanion.xcarchive
          BUILD_EXIT=$?
          set -e

          echo "=== xcodebuild DONE at $(date -u +%H:%M:%SZ); exit=${BUILD_EXIT} ==="
          echo "=== Archive directory check ==="
          ls -la ./SmartSpeedCompanion.xcarchive 2>&1 | head -25 || true

          if [ "${BUILD_EXIT}" -ne 0 ]; then
            echo "*** FATAL: xcodebuild failed with exit ${BUILD_EXIT} ***"
            exit "${BUILD_EXIT}"
          fi

          if [ ! -d "./SmartSpeedCompanion.xcarchive" ]; then
            echo "*** FATAL: xcodebuild exited 0 but no .xcarchive was produced ***"
            exit 1
          fi

          echo "=== Archive verified ==="
          ls -la ./SmartSpeedCompanion.xcarchive/
        timeout-minutes: 90

      - name: Verify archive exists
        run: |
          if [ -d "./SmartSpeedCompanion.xcarchive" ]; then
            echo "[OK] Archive created successfully"
            ls -la ./SmartSpeedCompanion.xcarchive/
          else
            echo "[ERROR] Archive not found!"
            exit 1
          fi

      - name: Export IPA with manual signing and profile embedding
        env:
          KEYCHAIN_PASSWORD: "build_keychain_pass"
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          echo "=== Signing identities available ==="
          security find-identity -v -p codesigning build.keychain

          echo "=== Provisioning profiles available ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"

          mkdir -p "$PWD/Export"
          mkdir -p "$PWD/IPAWork"

          echo "=== Exporting IPA with manual signing ==="
          python3 -c "import plistlib; plistlib.dump({'method': 'app-store-connect', 'signingStyle': 'manual', 'signingIdentity': 'Apple Distribution', 'provisioningProfileSpecifier': 'Speedio App Store', 'teamID': 'VCNBBG32P6', 'uploadBitcode': False, 'uploadSymbols': True}, open('$PWD/exportOptions.plist', 'wb'))"
          echo "exportOptions.plist created"

          xcodebuild -exportArchive -archivePath "$PWD/SmartSpeedCompanion.xcarchive" -exportOptionsPlist "$PWD/exportOptions.plist" -exportPath "$PWD/Export"

          echo "=== Locating IPA ==="
          IPA_PATH=$(find "$PWD/Export" -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "[ERROR] No IPA file found"
            exit 1
          fi
          echo "[OK] IPA found: $IPA_PATH"
          echo "IPA size: $(wc -c < "$IPA_PATH") bytes"

          echo "=== Checking for embedded.mobileprovision ==="
          if unzip -l "$IPA_PATH" | grep -q "embedded.mobileprovision"; then
            echo "[OK] embedded.mobileprovision already present in IPA"
          else
            echo "[WARN] embedded.mobileprovision NOT found -- manually embedding..."

            if [ ! -f /tmp/profile.mobileprovision ]; then
              echo "[ERROR] /tmp/profile.mobileprovision not found!"
              exit 1
            fi

            cd "$PWD/IPAWork"
            unzip -o "$IPA_PATH" > /dev/null 2>&1

            APP_BUNDLE=$(find . -name "*.app" -type d | head -1)
            if [ -z "$APP_BUNDLE" ]; then
              echo "[ERROR] No .app bundle found in IPA"
              exit 1
            fi
            echo "Found app bundle: $APP_BUNDLE"              # Re-sign with entitlements. Sign nested .appex INWARD-OUT
              # (extensions first, parent last) so the parent .app's seal
              # wraps already-signed nested bundles — this mirrors what
              # Xcode does during native `xcodebuild -exportArchive`.
              # Without this loop the widget appex ships with zero
              # entitlements and `xcrun altool --upload-app` rejects the
              # upload with "Missing Code Signing Entitlements. No
              # entitlements found in bundle com.speedsense.app.SpeedWidget ...".
              cp /tmp/profile.mobileprovision "$APP_BUNDLE/embedded.mobileprovision"
              echo "[OK] Embedded provisioning profile into: $APP_BUNDLE/embedded.mobileprovision"

              security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
              for APPEX in "$APP_BUNDLE/PlugIns"/*.appex; do
                [ -d "$APPEX" ] || continue
                cp /tmp/profile.mobileprovision "$APPEX/embedded.mobileprovision"
                ENT_NAME="$(basename "$APPEX" .appex)"
                # Resolve the entitlements plist by basename match. We are
                # in $PWD/IPAWork so `../SmartSpeedCompanion/Resources/...`
                # resolves relative to the repo source tree.
                ENT_FILE="../SmartSpeedCompanion/Resources/Entitlements/${ENT_NAME}.entitlements"
                if [ -f "$ENT_FILE" ]; then
                  codesign --force --sign "Apple Distribution" --entitlements "$ENT_FILE" "$APPEX"
                  echo "[OK] Re-signed app extension $APPEX with $ENT_FILE"
                else
                  codesign --force --sign "Apple Distribution" "$APPEX"
                  echo "[WARN] Re-signed $APPEX without entitlements (no $ENT_FILE in IPAWork/../...)"
                fi
              done

              if [ -f /tmp/entitlements.plist ]; then
                codesign --force --sign "Apple Distribution" --entitlements /tmp/entitlements.plist "$APP_BUNDLE"
                echo "[OK] Re-signed app bundle with entitlements"
              else
                codesign --force --sign "Apple Distribution" "$APP_BUNDLE"
                echo "[WARN] Re-signed without entitlements (not found in profile)"
              fi

            rm -f "$IPA_PATH"
            zip -rq "$IPA_PATH" Payload/
            echo "[OK] Repackaged IPA with embedded.mobileprovision"

            cd "$PWD"
          fi

          echo "=== Final IPA verification ==="
          if unzip -l "$IPA_PATH" | grep -q "embedded.mobileprovision"; then
            echo "[OK] embedded.mobileprovision CONFIRMED in final IPA"
          else
            echo "[ERROR] STILL missing embedded.mobileprovision!"
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Speedio-IPA-${{ github.run_number }}
          path: Export/*.ipa
          retention-days: 7